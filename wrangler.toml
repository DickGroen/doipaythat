name = "doipaythat"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENV = "production"
ADMIN_EMAIL = "groenvantexel@gmail.com"
SITE_URL = "https://doipaythat.co.uk"

# Stripe Payment Links (public — not secrets)
STRIPE_LINK_DEBT         = "https://buy.stripe.com/REPLACE_WITH_DEBT_LINK"
STRIPE_LINK_PARKING      = "https://buy.stripe.com/REPLACE_WITH_PARKING_LINK"
STRIPE_LINK_BILL         = "https://buy.stripe.com/REPLACE_WITH_BILL_LINK"
STRIPE_LINK_SUBSCRIPTION = "https://buy.stripe.com/REPLACE_WITH_SUBSCRIPTION_LINK"
STRIPE_LINK_QUOTE        = "https://buy.stripe.com/REPLACE_WITH_QUOTE_LINK"

# Secrets via Cloudflare Dashboard:
# ANTHROPIC_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY

[[kv_namespaces]]
binding = "DEBT_QUEUE"
id = "79aa4e89ce7c4699a36c73a6ea8a8af2"

[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "doipaythat-docs"

[triggers]
crons = ["*/5 * * * *"]

routes = [
  { pattern = "doipaythat.co.uk/api/*", zone_name = "doipaythat.co.uk" }
]
