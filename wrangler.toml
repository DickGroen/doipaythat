name = "doipaythat"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENV = "production"
ADMIN_EMAIL = "support@doipaythat.co.uk"

# Secrets via Cloudflare Dashboard:
# ANTHROPIC_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY

[[kv_namespaces]]
binding = "DEBT_QUEUE"
id = "REPLACE_WITH_REAL_KV_ID"

[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "doipaythat-docs"

[triggers]
crons = ["*/5 * * * *"]

routes = [
  { pattern = "doipaythat.co.uk/api/*", zone_name = "doipaythat.co.uk" }
]
