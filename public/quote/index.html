<section class="hero">
  <div class="container">
    <div class="hero__eyebrow">Quote Check</div>

    <h1>Are you overpaying for this quote?</h1>

    <p class="hero__sub">
      Upload your quote and see whether the price is fair before you agree.
    </p>

    <div class="value-strip">
      <div class="value-item">✓ Free first check</div>
      <div class="value-item">✓ Avoid overpaying</div>
      <div class="value-item">✓ Result within 24 hours</div>
    </div>

    <div class="upload-section" id="upload-area">
      <div class="upload-icon">📄</div>
      <div class="upload-label">Upload your quote</div>
      <div class="upload-hint">PDF, JPG or PNG · max. 10 MB</div>
      <input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png" />
    </div>

    <div class="cta-wrap">
      <button class="cta-main" id="free-check-btn">
        Check my quote for free
      </button>
      <div class="cta-sub">
        No obligation. You see a free indication first.
      </div>
    </div>
  </div>
</section>
